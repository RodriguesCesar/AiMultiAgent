services:

  mongo:
    image: mongo:7
    container_name: mongo_ai
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: mongo_express_ai
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongo
    networks:
      - ai_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_ai
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: ai_api
    build:
      context: .
      dockerfile: AiMultiAgent.API/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - ai_network

  worker:
    container_name: ai_worker
    build:
      context: .
      dockerfile: AiMultiAgent.Worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  mongo_data: